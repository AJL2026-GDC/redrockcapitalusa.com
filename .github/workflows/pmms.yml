name: Weekly mortgage rates (Freddie Mac PMMS)

on:
  schedule:
    # Freddie Mac publishes PMMS Thursdays at noon ET; run Thursday 18:30 UTC and Friday as a fallback.
    - cron: "30 18 * * 4"
    - cron: "30 14 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build rates.json
        run: python3 scripts/pmms.py https://www.freddiemac.com/pmms/docs/PMMS_history.csv rates.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- rates.json; then echo "No change"; exit 0; fi
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git commit -m "Weekly PMMS rates update"
          git push
